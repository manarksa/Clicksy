<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clicksy — premium event photography and film crews. Browse packages, build a live quote, book when ready."
    />
    <title>Clicksy — Your night, framed.</title>
    <script>
      try {
        var lang = localStorage.getItem('clicksy_language')
        if (lang !== 'en' && lang !== 'ar') lang = 'en'
        var root = document.documentElement
        root.lang = lang
        root.dir = lang === 'ar' ? 'rtl' : 'ltr'
        document.title =
          lang === 'ar'
            ? 'Clicksy — ليلتكم في إطار.'
            : 'Clicksy — Your night, framed.'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
